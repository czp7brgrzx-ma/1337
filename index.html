<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1337 — access granted</title>
<style>
:root{
  --bg:#050807; --ink:#c8ffd4; --dim:#4a7a58;
  --green:#00ff88; --green-soft:#00ff8822;
  --red:#ff2e4d; --line:#0f2418;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--mono); overflow-x:hidden;
  min-height:100vh; position:relative;
}
#matrix{
  position:fixed; inset:0; z-index:0;
  opacity:.35; pointer-events:none;
}
.scanlines{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(
    0deg, transparent 0 2px, #00000066 2px 3px
  );
  mix-blend-mode:multiply;
}
.vignette{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse at center,
    transparent 40%, #000000cc 100%);
}
main{
  position:relative; z-index:2;
  max-width:920px; margin:0 auto;
  padding:6rem 1.5rem 4rem;
}

/* ---- TERMINAL FRAME ---- */
.terminal{
  border:1px solid var(--line);
  border-radius:12px;
  background:#060d09cc;
  backdrop-filter:blur(4px);
  box-shadow:
    0 0 0 1px #000 inset,
    0 0 60px -20px var(--green),
    0 20px 60px -30px #000;
  overflow:hidden;
}
.term-bar{
  display:flex; align-items:center; gap:.5rem;
  padding:.7rem 1rem;
  background:#08120c;
  border-bottom:1px solid var(--line);
}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f56}
.dot.y{background:#ffbd2e}
.dot.g{background:#27c93f}
.term-title{
  margin-inline-start:auto; font-size:.75rem;
  color:var(--dim); letter-spacing:2px;
}
.term-body{
  padding:2rem 1.75rem;
  font-size:.95rem; line-height:1.9;
}

/* ---- HERO ---- */
.banner{
  font-size:clamp(2.6rem,9vw,5rem);
  font-weight:700; letter-spacing:.15em;
  line-height:1; margin-bottom:.5rem;
  color:var(--green);
  text-shadow:
    0 0 6px var(--green),
    0 0 24px #00ff8855,
    0 0 60px #00ff8822;
  position:relative;
}
.banner::before,
.banner::after{
  content:attr(data-text);
  position:absolute; inset:0;
  clip-path:inset(0 0 0 0);
}
.banner::before{
  color:var(--red); left:2px;
  animation:glitch-a 2.4s infinite steps(2,end);
  opacity:.7;
}
.banner::after{
  color:#00e0ff; left:-2px;
  animation:glitch-b 3.1s infinite steps(2,end);
  opacity:.6;
}
@keyframes glitch-a{
  0%,92%,100%{transform:translate(0)}
  93%{transform:translate(-2px,1px)}
  95%{transform:translate(2px,-1px)}
  97%{transform:translate(-1px,0)}
}
@keyframes glitch-b{
  0%,88%,100%{transform:translate(0)}
  89%{transform:translate(2px,-1px)}
  91%{transform:translate(-2px,1px)}
  94%{transform:translate(1px,1px)}
}

.tag{
  color:var(--dim); font-size:.8rem;
  letter-spacing:.3em; margin-bottom:2.5rem;
  text-transform:uppercase;
}

/* ---- TERMINAL LINES ---- */
.lines{list-style:none; margin-bottom:2rem}
.lines li{
  opacity:0; animation:reveal .5s forwards;
}
.lines li:nth-child(1){animation-delay:.4s}
.lines li:nth-child(2){animation-delay:1.1s}
.lines li:nth-child(3){animation-delay:1.8s}
.lines li:nth-child(4){animation-delay:2.5s}
.lines li:nth-child(5){animation-delay:3.2s}
.lines li:nth-child(6){animation-delay:3.9s}
@keyframes reveal{to{opacity:1}}
.prompt{color:var(--green)}
.cmd{color:#e6fff0}
.ok{color:var(--green)}
.warn{color:#ffbd2e}
.err{color:var(--red)}
.muted{color:var(--dim)}
.cursor{
  display:inline-block; width:.55em; height:1.1em;
  background:var(--green); vertical-align:-2px;
  animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

/* ---- ACTIONS ---- */
.actions{
  display:flex; flex-wrap:wrap; gap:.75rem;
  margin-top:2rem;
}
.btn{
  font-family:var(--mono); font-size:.85rem;
  padding:.85rem 1.4rem; border-radius:8px;
  cursor:pointer; text-decoration:none;
  letter-spacing:.1em; text-transform:uppercase;
  transition:all .15s ease; border:1px solid;
  background:transparent;
}
.btn.primary{
  border-color:var(--green); color:var(--green);
  box-shadow:0 0 20px -6px var(--green), inset 0 0 0 0 var(--green);
}
.btn.primary:hover{
  background:var(--green); color:#000;
  box-shadow:0 0 40px -4px var(--green);
}
.btn.ghost{
  border-color:var(--line); color:var(--dim);
}
.btn.ghost:hover{
  border-color:var(--green); color:var(--ink);
}

/* ---- FOOTER ---- */
.foot{
  margin-top:3rem; padding-top:1.5rem;
  border-top:1px dashed var(--line);
  display:flex; justify-content:space-between;
  font-size:.7rem; color:var(--dim);
  flex-wrap:wrap; gap:.5rem;
  letter-spacing:.15em;
}
.foot .live::before{
  content:"●"; color:var(--green);
  margin-inline-end:.4em;
  animation:blink 2s steps(2) infinite;
}

@media (max-width:560px){
  main{padding:3rem 1rem 2rem}
  .term-body{padding:1.5rem 1.1rem; font-size:.85rem}
  .foot{font-size:.65rem}
}
</style>
</head>
<body>

<canvas id="matrix" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main>
  <div class="terminal">
    <div class="term-bar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="term-title">root@1337:~#</span>
    </div>
    <div class="term-body">

      <h1 class="banner" data-text="1337">1337</h1>
      <p class="tag">elite · access granted · root shell</p>

      <ul class="lines">
        <li><span class="prompt">$</span> <span class="cmd">whoami</span></li>
        <li><span class="ok">✓</span> <span class="muted">identity: anonymous</span></li>
        <li><span class="prompt">$</span> <span class="cmd">cat /etc/motd</span></li>
        <li><span class="ok">→</span> <span class="muted">welcome to the underground</span></li>
        <li><span class="prompt">$</span> <span class="cmd">mount --bind /knowledge /power</span> <span class="cursor"></span></li>
        <li><span class="ok">✓ mounted</span> <span class="warn">— no permission denied here</span></li>
      </ul>

      <div class="actions">
        <a href="#tools" class="btn primary">عرض الأدوات</a>
        <a href="#contact" class="btn ghost">تواصل</a>
      </div>

      <div class="foot">
        <span class="live">system online</span>
        <span>uptime: forever</span>
        <span>enc: aes-256</span>
      </div>

    </div>
  </div>
</main>

<script>
// matrix rain
(() => {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';
  const size = 16;
  let cols, drops;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / size);
    drops = Array(cols).fill(1).map(() => Math.random() * -100);
  }
  resize();
  window.addEventListener('resize', resize);

  function draw() {
    ctx.fillStyle = 'rgba(5,8,7,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff88';
    ctx.font = `${size}px ui-monospace, monospace`;
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * size, drops[i] * size);
      if (drops[i] * size > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  setInterval(draw, 55);
})();

// type cursor blip — خفيف، مفيش نصوص طويلة تتعاد
(() => {
  // nothing extra — cursor handles blink via CSS
})();
</script>
</body>
</html>
